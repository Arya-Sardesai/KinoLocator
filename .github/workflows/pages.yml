name: Deploy to GitHub Pages

# Publishes web/ on every push to main (merged code changes go live without
# waiting for the next scrape) and on demand. The scrape workflow deploys
# its own snapshot commits; it pushes them with GITHUB_TOKEN, and pushes made
# with GITHUB_TOKEN don't trigger workflows, so a snapshot is never deployed
# twice.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with the scrape workflow's deploy job, so two deploys never overlap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The data files live at the repo root but the site is web/ only; the
      # page fetches them from its own origin. Same list as scrape.yml.
      - name: Copy data into web/
        run: cp showtimes.json manual_listings.json stats.json web/

      # A per-attempt name, so re-running a failed deploy doesn't leave two
      # artifacts with the same name in one run.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
          name: github-pages-${{ github.run_attempt }}

  # A separate job from the upload, with one retry after 30 s: deploying a
  # second after the upload sometimes found "0 artifacts" (see scrape.yml).
  deploy:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait before retrying the deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
