name: Scrape showtimes

on:
  schedule:
    # Twice daily, off the hour. Times are UTC: 13:17 = 06:17 and
    # 01:17 = 18:17 in Vancouver (UTC-7 year-round from Nov 2026).
    - cron: "17 13 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # For the GitHub Pages deploy at the end (the deploy job below).
  pages: write
  id-token: write

concurrency:
  group: scrape
  cancel-in-progress: false

env:
  # Use the pinned tzdata package rather than the runner's OS tz database.
  PYTHONTZPATH: ""
  # TMDB read access token (sent as a Bearer header; never logged, and
  # Actions masks it). Without it the run still works, matching from the
  # cache only, and the TMDB report says so.
  TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      deploy: ${{ steps.committed.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      # Offline, against recorded fixtures: if these fail the code is broken.
      - name: Unit tests
        run: pytest -q

      # Exit 0 = all venues ok; 3 = some scrapers failed but the good venues
      # (and the failures) were written. Anything else is a crash: stop here
      # without committing. Failures are re-raised in the last step, after commit.
      - name: Scrape all venues
        id: scrape
        run: |
          set +e
          python -m kinolocator run --out-dir .
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then exit "$code"; fi

      - name: Check archive is append-only
        run: |
          today=$(python -c 'from datetime import datetime; from kinolocator.schema import VANCOUVER; print(datetime.now(VANCOUVER).strftime("%Y/%m/%d"))')
          violations=$(git diff --name-only --diff-filter=MDR HEAD -- archive | grep -vx "archive/${today}.json" || true)
          if [ -n "$violations" ]; then
            echo "::error title=Archive is append-only::Past snapshots were modified or deleted: $violations"
            exit 1
          fi

      # stats.json (for web/stats.html) is rebuilt from every snapshot, so it
      # grows with each scrape.
      - name: Build stats
        run: python -m kinolocator stats --out-dir .

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add showtimes.json archive stats.json
          if [ -f tmdb_cache.json ]; then git add tmdb_cache.json; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          summary=$(python -m kinolocator summary --out-dir .)
          git commit -m "Showtimes snapshot $(date -u +%Y-%m-%dT%H:%MZ) (${summary})"
          for attempt in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::Could not push snapshot after 3 attempts"
          exit 1

      # Reached only once the snapshot is committed and pushed (or there was
      # nothing new to commit): tells the deploy job to publish it.
      - name: Mark snapshot committed
        id: committed
        run: echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Fail if any scraper failed
        if: steps.scrape.outputs.exit_code == '3'
        run: |
          echo "::error title=Scraper failure::One or more scrapers failed; the other venues were committed. See the run summary and the 'venues' block in showtimes.json."
          exit 1

  # Publishes web/ with the snapshot just committed to GitHub Pages. Runs even
  # when the scrape job ends red because a scraper failed (the good venues
  # were still committed), but not if the run crashed before committing.
  deploy:
    needs: scrape
    if: ${{ !cancelled() && needs.scrape.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Shared with pages.yml, so two deploys never overlap. On this job only:
    # a group holds one pending run, and a scrape must never be the one dropped.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The branch head, not the commit that started the run: it includes the
      # snapshot commit the scrape job just pushed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # The data files live at the repo root but the site is web/ only; the
      # page fetches them from its own origin.
      - name: Copy data into web/
        run: cp showtimes.json manual_listings.json stats.json web/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
