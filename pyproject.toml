[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinolocator"
version = "0.1.0"
description = "Greater Vancouver movie showtime aggregator"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    # BC moved to permanent UTC-7 on 2026-11-01; older tz data gets that wrong.
    # CI sets PYTHONTZPATH="" so zoneinfo reads this package, not the OS copy.
    "tzdata>=2026.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kinolocator = "kinolocator.cli:main"

[tool.setuptools.packages.find]
include = ["kinolocator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
